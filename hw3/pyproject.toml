[project]
name = "hw3-q-learning"
version = "0.1.0"
description = "CS285 HW3: Q-Learning and Actor-Critic Algorithms"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "matplotlib>=3.10.8",
    "ml-collections>=1.1.0",
    "modal>=1.6.4,<1.7.0",
    "opencv-python<4.12.0.88",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "wandb[media]>=0.23.1",
    "gym[classic_control,mujoco,box2d,atari,accept-rom-license]==0.25.2",
    "numpy<2.0.0",
    "pyyaml>=6.0",
    "gradescope-utils>=0.5.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The 2.2.0 release is no longer indexed; retain the original locked Linux wheel.
override-dependencies = [
    "mujoco @ https://files.pythonhosted.org/packages/03/3c/af34a1d53370e2317c379faf23241c6a961e64019cfdfa85c4666b9e56a9/mujoco-2.2.0-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=8be58a89b2050d3db00d08117e08dcb354b9502a82ea2143c60f8a3c48a2cbca",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
